name: university_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  device_preview: ^1.2.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  http: ^1.2.1
  supabase_flutter: ^2.6.0
  flutter_naver_map: ^1.2.0
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/meals.json
    - assets/data/notices.json
